name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Standardmäßig nur lesen; der Release-Job erweitert das für sich.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System-Abhängigkeiten
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      # Sicherheitslücken, Lizenzen, Herkunft der Crates (siehe deny.toml)
      - run: cargo deny check
      # Ungenutzte Abhängigkeiten
      - run: cargo machete

  build:
    needs: [check, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            features: ""
          - name: windows-x86_64
            os: windows-latest
            features: ""
          - name: macos-arm64
            os: macos-14
            features: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System-Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libclang-dev cmake
      - name: libclang für bindgen (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: cargo build --release --locked ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Paket schnüren
        shell: bash
        run: |
          mkdir -p dist/tuto-mic
          cp README.md dist/tuto-mic/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/tuto-mic.exe dist/tuto-mic/
            (cd dist && 7z a ../tuto-mic-${{ matrix.name }}.zip tuto-mic)
          else
            cp target/release/tuto-mic dist/tuto-mic/
            tar -C dist -czf tuto-mic-${{ matrix.name }}.tar.gz tuto-mic
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tuto-mic-${{ matrix.name }}
          path: tuto-mic-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: tuto-mic-*
          generate_release_notes: true
