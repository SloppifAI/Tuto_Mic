name: Release

# Builds für Linux, Windows und macOS. Läuft nur bei einem Versions-Tag (v*) – dann mit GitHub-Release – oder
# von Hand über „Run workflow“ (Pakete nur als Artefakte, z. B. zum Testen vor einem Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Standardmäßig nur lesen; der Release-Job erweitert das für sich.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            features: ""
          - name: windows-x86_64
            os: windows-latest
            features: ""
          - name: macos-arm64
            os: macos-14
            features: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System-Abhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libclang-dev cmake
      - name: libclang für bindgen (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: cargo build --release --locked ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Paket schnüren
        shell: bash
        run: |
          mkdir -p dist/tuto-mic
          cp README.md dist/tuto-mic/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/tuto-mic.exe dist/tuto-mic/
            (cd dist && 7z a ../tuto-mic-${{ matrix.name }}.zip tuto-mic)
          else
            cp target/release/tuto-mic dist/tuto-mic/
            tar -C dist -czf tuto-mic-${{ matrix.name }}.tar.gz tuto-mic
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tuto-mic-${{ matrix.name }}
          path: tuto-mic-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # für den signierten Herkunftsnachweis (Build-Provenance)
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # Prüfsummen zum Vergleichen nach dem Download: `sha256sum -c SHA256SUMS.txt`
      - run: sha256sum tuto-mic-* > SHA256SUMS.txt
      # Belegt, dass die Pakete von diesem Workflow aus diesem Repo gebaut wurden:
      # `gh attestation verify <datei> --repo SloppifAI/Tuto_Mic`
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: tuto-mic-*
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tuto-mic-*
            SHA256SUMS.txt
          generate_release_notes: true
