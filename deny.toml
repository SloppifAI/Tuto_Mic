# Prüfung der Abhängigkeiten mit cargo-deny: `cargo deny check`

[graph]
all-features = true

[advisories]
# Sicherheitslücken schlagen immer an. Hinweise auf nicht mehr gepflegte Crates nur für direkte
# Abhängigkeiten – indirekte (z. B. aus egui) können wir nicht selbst austauschen.
unmaintained = "workspace"

[licenses]
# Nur freizügige Lizenzen; MPL-2.0 gilt pro Datei und ist für eine Anwendung unproblematisch.
# OFL/Ubuntu-Font: Standardschriften von egui. CDLA-Permissive: Root-Zertifikate (webpki-roots).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Eigene, nicht veröffentlichte Crate (publish = false) nicht prüfen.
ignore = true

[bans]
# GUI- und Audio-Crates ziehen unvermeidlich mehrere Versionen gleicher Crates nach.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
