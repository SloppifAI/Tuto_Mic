[package]
name = "tuto-mic"
version = "0.1.0"
description = "Unterricht aufnehmen, lokal transkribieren, pseudonymisieren und zusammenfassen"
edition = "2024"
# Anwendung, wird nicht auf crates.io veröffentlicht (Lizenz noch offen).
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37"
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = { version = "3.5.0", features = ["json"] }
whisper-rs = { version = "0.16.0", features = ["log_backend"] }

[features]
# GPU-Backends für whisper.cpp – je nach Plattform beim Build aktivieren.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

[profile.dev.package."*"]
# Abhängigkeiten (v. a. Resampling) auch im Debug-Build optimiert übersetzen.
opt-level = 2

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Statt `.unwrap()` ein `.expect("…")`, das erklärt, warum es nicht fehlschlagen kann (Tests ausgenommen,
# siehe clippy.toml).
unwrap_used = "warn"
dbg_macro = "warn"
# Audio- und Zeitrechnung wandelt bewusst zwischen Ganzzahlen und Gleitkomma.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Anwendung, keine veröffentlichte Bibliothek: Fehler- und `#[must_use]`-Dokumentation an jeder Funktion
# brächte keinen Mehrwert.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
