[package]
name = "tuto-mic"
version = "0.1.0"
description = "Unterricht aufnehmen, lokal transkribieren, pseudonymisieren und zusammenfassen"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37"
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = { version = "3.5.0", features = ["json"] }
whisper-rs = { version = "0.16.0", features = ["log_backend"] }

[features]
# GPU-Backends für whisper.cpp – je nach Plattform beim Build aktivieren.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

[profile.dev.package."*"]
# Abhängigkeiten (v. a. Resampling) auch im Debug-Build optimiert übersetzen.
opt-level = 2
