[package]
name = "tuto-mic"
version = "0.2.0"
description = "Unterricht aufnehmen, lokal transkribieren, pseudonymisieren und zusammenfassen"
edition = "2024"
# Anwendung, wird nicht auf crates.io veröffentlicht (Lizenz noch offen).
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.37"
env_logger = "0.11.11"
getrandom = "0.4.3"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = "4.2.0"
log = "0.4.34"
regex = "1.13.1"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strsim = "0.11.1"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = { version = "3.5.0", features = ["json"] }
url = "2.5.8"
webbrowser = "1.2.5"
zeroize = "1.9.1"

# GPU-Backend für whisper.cpp ohne Feature-Flag, je nach Plattform. Ohne passende GPU rechnet whisper.cpp auf
# der CPU. Vulkan läuft mit den normalen Treibern von NVIDIA, AMD und Intel; Metal auf Apple Silicon.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["log_backend", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["log_backend", "metal"] }

[features]
# Zusätzlich CUDA (NVIDIA, schneller als Vulkan). ggml nimmt dann das CUDA-Gerät zuerst.
cuda = ["whisper-rs/cuda"]

[profile.dev.package."*"]
# Abhängigkeiten (v. a. Resampling) auch im Debug-Build optimiert übersetzen.
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Statt `.unwrap()` ein `.expect("…")`, das erklärt, warum es nicht fehlschlagen kann (Tests ausgenommen,
# siehe clippy.toml).
unwrap_used = "warn"
dbg_macro = "warn"
# Audio- und Zeitrechnung wandelt bewusst zwischen Ganzzahlen und Gleitkomma.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Anwendung, keine veröffentlichte Bibliothek: Fehler- und `#[must_use]`-Dokumentation an jeder Funktion
# brächte keinen Mehrwert.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
